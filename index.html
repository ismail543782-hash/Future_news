    <script>
      // Global error shield to prevent third-party / cross-origin "Script error."
      window.addEventListener('error', function (event) {
        if (!event) return;
        var msg = (event.message || '');
        var src = (event.filename || '');
        if (
          msg === 'Script error.' ||
          (typeof msg === 'string' && msg.toLowerCase().indexOf('script error') !== -1) ||
          (src && src.indexOf(window.location.origin) === -1)
        ) {
          event.stopImmediatePropagation && event.stopImmediatePropagation();
          event.stopPropagation && event.stopPropagation();
          event.preventDefault && event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        if (!event) return;
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.indexOf('Script error') !== -1) {
          event.preventDefault && event.preventDefault();
        }
      }, true);

      window.onerror = function (msg, url) {
        if (
          msg === 'Script error.' ||
          (typeof msg === 'string' && msg.toLowerCase().indexOf('script error') !== -1) ||
          (url && url.indexOf(window.location.origin) === -1)
        ) {
          return true;
        }
        return false;
      };
    </script>
